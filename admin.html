<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261007-1"><meta name="viewport" content="width=device-width, initial-scale=1"><title>蟑螂杯#3 · 后台编辑</title><link rel="stylesheet" href="admin.css"></head>
<body>
  <section class="login-panel" id="loginPanel"><div class="login-card"><span class="eyebrow">COCKROACH CUP #3 / ADMIN</span><h1>后台登录</h1><p>登录后才能读取和修改赛事数据。</p><form id="loginForm"><label>用户名<input id="loginUsername" autocomplete="username" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="button" type="submit">登录</button><p class="login-error" id="loginError"></p></form></div></section>
  <main class="admin-shell" id="adminEditor" hidden>
    <header class="admin-header"><div><span class="eyebrow">COCKROACH CUP #3 / ADMIN</span><h1>赛事后台编辑</h1><p>所有公开数据均从这里维护；关闭页面发布后，观众只会看到“页面筹备中”。</p></div><div class="toolbar"><button class="button" id="save" type="button">保存全部数据</button><button class="button secondary" id="reload" type="button">重新读取</button><button class="button danger" id="logout" type="button">退出登录</button><span class="status" id="status"></span></div></header>
    <nav class="admin-pages" aria-label="后台编辑分页"><button class="active" data-admin-page="event" type="button">赛事信息</button><button data-admin-page="publication" type="button">页面发布</button><button data-admin-page="rules" type="button">规则文本</button><button data-admin-page="schedule" type="button">日程与选手</button><button data-admin-page="teams" type="button">队伍与选手</button></nav>
    <section class="panel admin-page active" data-admin-page-content="event"><h2>赛事信息</h2><div class="form-grid"><label>赛事简称<input id="shortName"></label><label>赛事全称<input id="fullName"></label><label class="wide">首页描述<textarea id="description"></textarea></label><label>赛事状态<input id="eventStatus"></label><label>比赛模式<input id="eventMode"></label><label>规则版本<input id="ruleVersion"></label><label class="wide">背景音乐路径<input id="audio"></label></div></section>
    <section class="panel admin-page" data-admin-page-content="publication"><h2>页面发布状态</h2><p>关闭后，公开接口不会返回该页面内容，观众只能看到筹备中提示。保存后立即生效。</p><div class="publication-grid"><label><input type="checkbox" data-publication-page="home"> 赛事首页</label><label><input type="checkbox" data-publication-page="rules"> 比赛规则</label><label><input type="checkbox" data-publication-page="schedule"> 选手与日程</label><label><input type="checkbox" data-publication-page="ranking"> 排名与积分</label></div></section>
    <section class="panel admin-page" data-admin-page-content="rules"><div class="section-heading"><div><h2>规则文本</h2><p>这里是官网“比赛规则”页的唯一数据源。</p></div><button class="button secondary" id="addRuleSection" type="button">新增规则章节</button></div><div id="rulesEditor"></div></section>
    <section class="panel admin-page" data-admin-page-content="schedule"><div class="section-heading"><div><h2>赛事日程与每日选手</h2><p>每天一场时，每个日期直接选择当天唯一选手；决赛日期只录入晋级队伍的选手。</p></div></div><div class="stage-grid"><div><h3>初赛</h3><div id="prelimSchedule"></div><button class="button secondary" data-add-day="prelim" type="button">新增初赛日期</button></div><div><h3>决赛</h3><div id="finalSchedule"></div><button class="button secondary" data-add-day="final" type="button">新增决赛日期</button></div></div></section>
    <section class="panel admin-page" data-admin-page-content="teams"><div class="section-heading"><div><h2>队伍与选手</h2><p>队伍、头像、分数、结局、抓位图和逐项加减分均可单独修改。</p></div><button class="button secondary" id="addTeam" type="button">新增队伍</button></div><div id="teamsEditor"></div></section>
  </main>
  <script type="module" src="admin.js?v=20261007-1"></script>
</body></html>
